events {
    # Bloque obligatorio para NGINX, gestiona conexiones
}

http {
    # Incluye los tipos de archivos estándar (para que el CSS y JS carguen bien)
    include /etc/nginx/mime.types;

    server {
        # Puerto y seguridad TLS
        listen 443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # Rutas y dominio
        root /var/www/html;
        server_name vhedo-ga.42.fr;
        index index.php index.html index.htm;

        # Manejo de rutas por defecto (Error 404 si no existe)
        location / {
            try_files $uri $uri/ =404;
        }

        # Pase de batón a WordPress para archivos PHP
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass wordpress:9000;
        }
    }
}
