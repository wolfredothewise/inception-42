[www]
user = www-data
group = www-data

# Listen on port 9000 for NGINX
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

# Process management
pm = dynamic
pm.max_children = 25
pm.start_servers = 5
pm.min_spare_servers = 1
pm.max_spare_servers = 10

# Allow environment variables
clear_env = no
